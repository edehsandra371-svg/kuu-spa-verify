<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuu Spa+ Product Verification</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f7f7;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

img{
    width:180px;
    border-radius:10px;
    margin-bottom:20px;
}

h1{
    color:#b8860b;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:14px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#b8860b;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#966d00;
}

#status{
    margin-top:15px;
    color:#555;
    font-size:14px;
}

.success{
    margin-top:20px;
    padding:15px;
    background:#d4edda;
    color:#155724;
    border-radius:10px;
}

.error{
    margin-top:20px;
    padding:15px;
    background:#f8d7da;
    color:#721c24;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="container">

<img src="product.jpg" alt="Kuu Spa+">

<h1>Kuu Spa+ Product Verification</h1>

<p>Enter your serial number below.</p>

<input
id="serial"
placeholder="Example: KSP-B1-000001">

<button onclick="verifySerial()">
Verify Product
</button>

<div id="status">
Loading serial database...
</div>

<div id="result"></div>

</div>

<script>

let serialDatabase=[];

fetch("batch1_serials.json")
.then(response=>response.json())
.then(data=>{

serialDatabase=data;

document.getElementById("status").innerHTML=
"✅ "+serialDatabase.length+" serial numbers loaded.";

alert("First serial: " + serialDatabase[0]);
alert("Last serial: " + serialDatabase[serialDatabase.length-1]);

})
.catch(error=>{

document.getElementById("status").innerHTML=
"❌ Could not load serial database.";

console.error(error);

});

function verifySerial(){

const code=document
.getElementById("serial")
.value
.trim()
.toUpperCase();

const result=document.getElementById("result");

if(serialDatabase.includes(code)){

result.innerHTML=`
<div class="success">
<h2>✅ AUTHENTIC PRODUCT</h2>

<p><strong>Kuu Spa+ Whitening Serum</strong></p>

<p>Serial Number:</p>

<p><strong>${code}</strong></p>

<p>This product is genuine.</p>
</div>
`;

}else{

result.innerHTML=`
<div class="error">
<h2>❌ INVALID SERIAL NUMBER</h2>

<p>The serial number was not found.</p>

<p>Please contact your distributor if you believe this is an error.</p>
</div>
`;

}

}

</script>

</body>
</html>
